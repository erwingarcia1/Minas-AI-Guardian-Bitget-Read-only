  # never written here (465aedd wrote only drill_account), so three settled
  # decisions rendered DEAD on production until these lines were written.
  sms: "held during beta. Enabling it starts real texts to 13 customers and spends SMS credits before the product is public."
  heartbeat: "vendor not yet chosen (#63)."
  thresholds: "no customer has needed one yet."
