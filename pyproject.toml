[project]
name = "sentinel"
version = "1.19.0"
description = "24/7 exchange-account compromise monitoring with read-only keys"
requires-python = ">=3.11"
dependencies = [
    # Pinned: the per-exchange adapters depend on ccxt internals (implicit
    # endpoint maps, fetch_transfers defaults, closed-orders emulation) that
    # were verified against exactly this version. Bump deliberately, re-running
    # the multi-exchange verification, never implicitly via an image rebuild.
    "ccxt==4.5.63",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "prometheus-client>=0.20",
    # Two-factor enrolment QR code: pure Python, no dependencies of its own; inline SVG on the pages, blocks in the terminal.
    "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    # Capped for the mutation gate (#156): mutmut 3.8.0's harness reads
    # pytest's item._nodeid, which pytest 9.2 removed, so its baseline run
    # errors on the first test and no mutant is ever scored. The cap moves
    # with MUTMUT_VERSION, never on its own (scripts/mutation-check.sh;
    # tests/test_scheduled_gates.py keeps the two numbers equal).
    "pytest>=8.0,<9.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]
triage = [
    "anthropic>=0.40",
]

[project.scripts]
sentinel = "sentinel.cli:cli_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
# schema.sql ships inside the package; without this a clean (non-editable)
# install crash-loops at startup - caught by the Docker dry run. The logo
# files are the same case: sentinel/brand.py reads them at import.
sentinel = ["schema.sql", "static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Wide, because this codebase carries a lot of explanatory prose in docstrings
# and a couple of embedded CSS constants. Narrowing it would reformat comments
# that are deliberately written as paragraphs.
line-length = 120

[tool.ruff.lint]
# Chosen to catch mistakes, not to impose a house style on code that was
# written deliberately. Notable omissions and why:
#
#   FURB157  would rewrite Decimal("0") to Decimal(0). The string form is
#            load-bearing here - see the header of config/rules.yaml. Enabling
#            it would fight the one convention the money code depends on.
#   UP017    timezone.utc -> datetime.UTC. Valid on 3.11+, but pure churn
#            across every module for no behavioural gain.
#   RUF059   unused unpacked variables, ~20 of them in test setup lines where
#            the pair reads better than the single value.
#   BLE001   blind excepts are deliberate in the poller and seeded baseline,
#            each already carrying a noqa and a comment explaining why one bad
#            account must not stall the fleet.
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]
ignore = [
    # `"col" in row.keys()` on a sqlite3.Row is NOT `"col" in row`: iterating a
    # Row yields its values, so the "simplification" silently changes a
    # column-presence check into a value search. Used in the pre-migration
    # guards in poller.py and dashboard.py, where getting it wrong means
    # reading the wrong column off an old database.
    "SIM118",
]

[tool.ruff.lint.per-file-ignores]
# Embedded stylesheets and page templates: one very long string constant each.
"sentinel/dashboard.py" = ["E501"]
"sentinel/metrics.py" = ["E501"]
"sentinel/portal.py" = ["E501"]
