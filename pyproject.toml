[project]
name = "sentinel"
version = "0.1.0"
description = "24/7 Bitget account-compromise monitoring service"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3.0",
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
triage = [
    "anthropic>=0.40",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
# schema.sql ships inside the package; without this a clean (non-editable)
# install crash-loops at startup - caught by the Docker dry run.
sentinel = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
