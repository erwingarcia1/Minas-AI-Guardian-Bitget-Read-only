services:
  sentinel:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - sentinel-data:/data
      - ./config:/app/config:ro   # rules.yaml stays hot-reloadable from the host
    ports:
      - "127.0.0.1:8390:8390"     # status dashboard - keep behind VPN/SSH tunnel, it has no auth
      - "127.0.0.1:9109:9109"     # prometheus metrics
    depends_on:
      - redis

  # Phase 2 scale-out targets. The MVP engine runs in-process (SQLite +
  # in-memory queue); these services are provisioned here so moving to
  # Postgres (SENTINEL_DB_DSN) and a Redis-backed distributed queue is a
  # config change on this same compose file, not a new deployment.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  sentinel-data:
  pg-data:
  redis-data:
