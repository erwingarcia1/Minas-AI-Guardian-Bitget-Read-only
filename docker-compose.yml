services:
  sentinel:
    build:
      context: .
      # Passed in by the deploy: `eval "$(scripts/deploy-gate.sh --export)"`
      # then `sudo -E docker compose build sentinel`. Unset means the image
      # reports its commit as `unknown`, which `sentinel version` treats as a
      # failure rather than papering over.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_TAG: ${GIT_TAG:-unknown}
    restart: unless-stopped
    env_file: .env
    # Explicit overrides beat env_file: a host .env carrying the local-dev
    # SENTINEL_DB_PATH (./sentinel_data/...) must never leak into the
    # container, or the credentials DB silently lands inside the container
    # filesystem and is destroyed on recreate. The volume is the truth.
    environment:
      SENTINEL_DB_PATH: /data/sentinel.db
      SENTINEL_RULES_PATH: /app/config/rules.yaml
      # Pinned so a host .env can't shift the listen ports out from under
      # the port mappings and healthcheck below.
      SENTINEL_DASHBOARD_PORT: "8390"
      SENTINEL_PORTAL_PORT: "8391"
      SENTINEL_METRICS_PORT: "9109"
      # All three servers default to 127.0.0.1 so the bare `sentinel run`
      # quickstart is private by default (G-36). In a container that default
      # would make them unreachable: Docker publishes a port by proxying to
      # the container's interface address, never to its loopback. So bind wide
      # *inside* the container and let the `127.0.0.1:` publish below be the
      # gate - which is where it belongs, since it's the host's network the
      # dashboard must stay off. Do not remove these without also changing the
      # port mappings and the healthcheck.
      SENTINEL_DASHBOARD_HOST: "0.0.0.0"
      SENTINEL_PORTAL_HOST: "0.0.0.0"
      SENTINEL_METRICS_HOST: "0.0.0.0"
      # Declares WHO holds the boundary for the wide binds above, so startup
      # can say so instead of warning on every correct deployment (#76). It
      # describes the `ports:` publishes below - if the publish changes,
      # change this in the same diff; a test holds the two together. The
      # caddy service below is the one public listener: it forwards /admin
      # and /admin/* to the dashboard (8390) and everything else to the
      # portal (8391), never the metrics endpoint (9109) -
      # deploy/caddy/Caddyfile; tests hold that too.
      SENTINEL_BIND_GATE: "docker-compose publishes 127.0.0.1:8390 on the host; the container-internal bind is unreachable off-host - the public proxy (caddy, 80/443) forwards /admin to the dashboard (8390) and everything else to the portal (8391), never the metrics endpoint (9109)"
      # The dashboard serves under this path (decision 22a): every link, form
      # action, redirect and the session cookie's Path carry it, and a request
      # for any other path gets 404 (a bare GET / answers 303 to the base
      # path, for the SSH tunnel) - except /healthz, which keeps answering
      # at the bare path for the healthcheck below. Caddy forwards the path
      # unchanged, so this must be the path the Caddyfile's @admin matcher
      # names; a test holds the two equal. Unset, the dashboard answers at
      # the root, as the bare `sentinel run` quickstart does.
      SENTINEL_DASHBOARD_BASE_PATH: "/admin"
      # Decision 22c item 6: behind Caddy every connection comes from Caddy,
      # and a throttle keyed on that address is one bucket for every visitor
      # - five wrong passwords from anyone would block every member's
      # sign-in, and five wrong operator passwords every operator's.
      # X-Forwarded-For is believed from this address and no other: caddy's
      # fixed ipv4_address on the `edge` network below. The portal and the
      # dashboard each have their own setting, so neither inherits the
      # other's trust; the code's default for both is blank (no proxy).
      # Change the three together with caddy's fixed address; a test holds
      # them equal.
      SENTINEL_TRUSTED_PROXIES: "10.231.0.2"
      SENTINEL_DASHBOARD_TRUSTED_PROXIES: "10.231.0.2"
    volumes:
      - sentinel-data:/data
      - ./config:/app/config:ro   # rules.yaml hot-reloads when a deploy updates the checkout; never edited on the host
    ports:
      - "127.0.0.1:8390:8390"     # ops dashboard - loopback: the break-glass path is an SSH tunnel to this port, then http://localhost:8390/admin/; caddy reaches it over the edge network
      - "127.0.0.1:8391:8391"     # member portal - loopback: nothing on the host needs it; caddy reaches it over the edge network
      - "127.0.0.1:9109:9109"     # prometheus metrics - loopback only: never proxied, read through an SSH tunnel
    # `default` as before, plus `edge`, where caddy reaches the portal as
    # sentinel:8391 and the dashboard as sentinel:8390.
    networks:
      default: {}
      edge: {}
    # The process needs no Linux capabilities and must never gain any: it
    # parses attacker-influenceable exchange API responses while holding
    # decrypted credentials in memory.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    # Headroom over the 1024 default that the request-path fd leak exhausted
    # in ~90 minutes (#79). The leak is fixed; this is defence in depth so the
    # NEXT descriptor bug degrades the dashboard before it starves alert
    # delivery, which shares this budget.
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    healthcheck:
      # python-slim has no curl; stdlib does the job. /healthz, not the
      # dashboard root: the root is behind the operator sign-in (the old
      # probe passed only while the empty-table waiver held the door open),
      # and /healthz asserts the ENGINE completed a cycle recently rather
      # than merely that an HTTP thread answered (#79's shape).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8390/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The public edge (decision 22b, answered 2026-10-23): TLS for
  # https://guardian.minastrade.com, certificates from Let's Encrypt, renewed
  # by Caddy itself. The ONLY public listener on this host (22c item 4):
  # every other publish in this file is on 127.0.0.1. It forwards /admin and
  # /admin/* to the ops dashboard (sentinel:8390, path unchanged) and
  # everything else to the member portal (sentinel:8391), never the metrics
  # endpoint - deploy/caddy/Caddyfile; docs/deployment.md says how it is
  # brought up.
  caddy:
    # An exact release, and the digest it had when it was checked
    # (2026-10-23, v2.11.7, the latest stable): a tag can be re-pushed, a
    # digest cannot. Bump both deliberately, and validate the Caddyfile
    # against the new image before it ships.
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP challenge, and the redirect to HTTPS
      - "443:443"   # TCP only: the Caddyfile turns HTTP/3 (UDP) off
    volumes:
      # A directory, read-only: the image's docs warn that a single-file
      # mount misses edits.
      - ./deploy/caddy:/etc/caddy:ro
      # Certificates and the ACME account. Persist it: losing it means
      # re-issuing, and Let's Encrypt rate-limits issuance per hostname.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # Fixed, so both servers can trust exactly this address and no other
        # (SENTINEL_TRUSTED_PROXIES and SENTINEL_DASHBOARD_TRUSTED_PROXIES
        # above). Outside the network's ip_range, so no other container can
        # ever be handed it.
        ipv4_address: 10.231.0.2
    # Same posture as sentinel, as far as Caddy allows. The image runs as
    # root and its binary carries the file capability cap_net_bind_service;
    # with every capability dropped, exec itself fails ("operation not
    # permitted", checked 2026-10-23), so exactly that one is added back.
    # NET_ADMIN, which the image's docs suggest for HTTP/3's UDP buffers, is
    # not needed with HTTP/3 off.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  # The hop between caddy and the two servers it fronts. Its own network,
  # with a subnet fixed here so caddy's address can be fixed and trusted
  # (22c item 6).
  # 10.231.0.0/24 is clear of Docker's default pools (172.17-172.31, then
  # 192.168) and of the default VPC (172.31.0.0/16); check `ip -4 route` on
  # a new host before the first `up` (docs/deployment.md). IPv4 only: the
  # trusted address is an IPv4 address, and a connection arriving over IPv6
  # would come from an address nobody trusts.
  edge:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.231.0.0/24
          gateway: 10.231.0.1
          # Dynamic addresses (sentinel, one-off `compose run` containers)
          # come from the upper half only, so caddy's fixed .2 is never
          # handed to anything else.
          ip_range: 10.231.0.128/25

volumes:
  sentinel-data:
  caddy-data:
  caddy-config:
