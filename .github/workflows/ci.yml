name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The mutation job below is too slow for every push (mutant generation alone
  # is ~8 minutes and is not cacheable across runners), so it runs weekly and
  # on demand instead. A ratchet that only moves on a schedule still only ever
  # moves one way.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check sentinel tests

      # The floor is measured, not aspirational: the suite was at 78.87% when
      # this gate was added, so 78 is the real number with a fraction of
      # rounding headroom. The criterion is that coverage doesn't *silently
      # decline*, which means the floor has to sit just under where we actually
      # are - a round 80 would fail on day one, and a round 50 would let half
      # the suite rot away without a word. Raise it when the number rises.
      - name: Test (mocked CCXT — no network to any exchange)
        run: pytest -q --cov=sentinel --cov-report=term-missing --cov-fail-under=78

      # Audits the dependencies this project declares, resolved from
      # pyproject.toml. Deliberately not a bare `pip-audit`, which audits the
      # whole environment and reports advisories against the runner's own pip
      # and setuptools - findings nobody can act on from this repo, and the
      # fastest way to teach a team to ignore a security gate.
      - name: Dependency vulnerability scan
        run: pip-audit .

      - name: Compose config is valid
        run: |
          docker compose version
          cp .env.example .env   # git-ignored at runtime; a placeholder satisfies env_file
          docker compose config --quiet && echo "compose OK"
          rm -f .env

      # The image is what production runs, and nothing built it until now -
      # `docker compose config` only proves the compose file parses.
      #
      # What this covers that no test can: the GIT_SHA build-arg -> Dockerfile
      # ENV -> `sentinel version` chain. The unit tests set SENTINEL_GIT_SHA
      # directly, and a source checkout takes the git fallback, so the path
      # production actually uses was the one path never executed. Its failure
      # mode is loud (version reports `unknown`, exit 1), but finding that out
      # on the server is what this repo keeps closing.
      - name: Image builds and reports the commit it was built from
        run: |
          docker build --build-arg GIT_SHA="$GITHUB_SHA" --build-arg GIT_TAG=ci -t sentinel-ci .

          out=$(docker run --rm sentinel-ci sentinel version)
          echo "$out"
          echo "$out" | grep -q "$GITHUB_SHA" \
            || { echo "::error::image does not report the commit it was built from"; exit 1; }
          echo "$out" | grep -q "build-arg" \
            || { echo "::error::image reports a commit but not via the build arg"; exit 1; }

      # The other half: a build given no commit must say so and fail, rather
      # than naming something plausible. Reuses every cached layer above, so
      # it costs seconds.
      - name: An image built without a commit refuses to claim one
        run: |
          docker build -t sentinel-ci-nosha .
          if docker run --rm sentinel-ci-nosha sentinel version; then
            echo "::error::a build with no GIT_SHA reported success"; exit 1
          fi
          out=$(docker run --rm sentinel-ci-nosha sentinel version 2>/dev/null || true)
          echo "$out"
          echo "$out" | grep -q "commit *unknown" \
            || { echo "::error::expected the commit to be reported as unknown"; exit 1; }
          # And it must not claim the placeholder came from a build arg - the
          # `source` field exists to say how we know, so it has to be right
          # when the answer is "we don't".
          echo "$out" | grep -q "source *unknown" \
            || { echo "::error::a build given no commit claimed a provenance"; exit 1; }

  # The slow gates, on a schedule (#86): the decision-point mutation floor
  # AND the design-guard probes. Weekly and on-demand, NOT per push - they
  # are canonically scheduled jobs, too slow for feedback anyone acts on -
  # and release.sh still demands both locally before a tag exists. Between
  # releases, CI is the source of truth: reproducible, does not stop when a
  # laptop sleeps, and a fresh checkout makes every run PROVABLY cold (the
  # first step below asserts no caches, so the 8-second cached pass that is
  # indistinguishable from a 2951-second real one - except in a log nobody
  # rereads - cannot happen here).
  #
  # Failure reporting distinguishes, in the ISSUE TITLE, a real regression
  # from a gate that produced no result. The previous version filed "score
  # dropped below the floor" on any non-zero exit - sending someone hunting
  # a lost test when the gate itself was broken. The classification and the
  # filing live in scripts/scheduled-gates-report.sh, where they are
  # execution-tested against synthetic logs (tests/test_scheduled_gates.py);
  # this file only wires the steps.
  #
  # (Was the `mutation` job; renamed when the probes joined it.)
  scheduled-gates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Measured, not guessed: mutation alone took 20 minutes cold on this
    # runner (run 32003357961); the probes are ~13 minutes locally. 75 gives
    # a slow runner room without letting a wedged run burn hours - and a
    # timeout kill is reported as "produced no result", never as a
    # regression: the report step runs on `always()`.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install mutmut

      # The cold-run proof. A per-mutant cache can hand back a full score in
      # seconds, and a cached pass is indistinguishable from a real one
      # except in the log - the shape that hid a broken gate for weeks. A
      # fresh runner cannot have a cache; asserting that makes it evidence
      # instead of an assumption.
      - name: A fresh runner has no gate caches
        run: |
          test ! -d mutants || { echo "::error::mutants/ exists before the run - a cached score would be indistinguishable from a real one"; exit 1; }
          test ! -f .mutation-probe.lock || { echo "::error::a probe lock file exists on a fresh runner"; exit 1; }

      # continue-on-error on both gates: each must produce its own verdict.
      # Aborting the job at the first failure would report the second gate as
      # nothing at all, and "nothing" reads as fine from the Actions list.
      - name: Design-guard probes
        id: probes
        continue-on-error: true
        run: |
          set -o pipefail
          time python scripts/mutation-probe.py scripts/probes/design-guards.json 2>&1 | tee probes.log

      # Fails if the score drops below scripts/mutation-floor.txt, and raises
      # the floor when it improves - so a decision this suite pins today
      # cannot quietly stop being pinned tomorrow. (A floor raised here is
      # discarded with the runner; the ratchet commits move through local
      # runs and releases.)
      - name: Decision-point mutation score
        id: mutation
        continue-on-error: true
        run: |
          set -o pipefail
          time scripts/mutation-check.sh --check 2>&1 | tee mutation.log

      # Filing an issue is the one notification path that needs no secrets
      # and reaches a human through normal repo notifications - and it leaves
      # a record that outlives the 90-day log retention. Deliberately NOT
      # routed through the operator alerting channel (#53): that lives inside
      # the running service and needs the database and channel credentials,
      # neither of which a CI runner has or should have.
      - name: Classify the results and file truthfully-titled issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBES_OUTCOME: ${{ steps.probes.outcome }}
          MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: bash scripts/scheduled-gates-report.sh
