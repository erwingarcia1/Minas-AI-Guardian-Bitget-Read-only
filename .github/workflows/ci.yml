name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test (mocked CCXT — no network to any exchange)
        run: pytest -q

      - name: Compose config is valid
        run: |
          docker compose version
          cp .env.example .env   # git-ignored at runtime; a placeholder satisfies env_file
          docker compose config --quiet && echo "compose OK"
          rm -f .env
