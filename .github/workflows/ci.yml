name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The mutation job below is too slow for every push (mutant generation alone
  # is ~8 minutes and is not cacheable across runners), so it runs weekly and
  # on demand instead. A ratchet that only moves on a schedule still only ever
  # moves one way.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check sentinel tests

      # The floor is measured, not aspirational: the suite was at 78.87% when
      # this gate was added, so 78 is the real number with a fraction of
      # rounding headroom. The criterion is that coverage doesn't *silently
      # decline*, which means the floor has to sit just under where we actually
      # are - a round 80 would fail on day one, and a round 50 would let half
      # the suite rot away without a word. Raise it when the number rises.
      - name: Test (mocked CCXT — no network to any exchange)
        run: pytest -q --cov=sentinel --cov-report=term-missing --cov-fail-under=78

      # Audits the dependencies this project declares, resolved from
      # pyproject.toml. Deliberately not a bare `pip-audit`, which audits the
      # whole environment and reports advisories against the runner's own pip
      # and setuptools - findings nobody can act on from this repo, and the
      # fastest way to teach a team to ignore a security gate.
      - name: Dependency vulnerability scan
        run: pip-audit .

      - name: Compose config is valid
        run: |
          docker compose version
          cp .env.example .env   # git-ignored at runtime; a placeholder satisfies env_file
          docker compose config --quiet && echo "compose OK"
          rm -f .env

      # The image is what production runs, and nothing built it until now -
      # `docker compose config` only proves the compose file parses.
      #
      # What this covers that no test can: the GIT_SHA build-arg -> Dockerfile
      # ENV -> `sentinel version` chain. The unit tests set SENTINEL_GIT_SHA
      # directly, and a source checkout takes the git fallback, so the path
      # production actually uses was the one path never executed. Its failure
      # mode is loud (version reports `unknown`, exit 1), but finding that out
      # on the server is what this repo keeps closing.
      - name: Image builds and reports the commit it was built from
        run: |
          docker build --build-arg GIT_SHA="$GITHUB_SHA" --build-arg GIT_TAG=ci -t sentinel-ci .

          out=$(docker run --rm sentinel-ci sentinel version)
          echo "$out"
          echo "$out" | grep -q "$GITHUB_SHA" \
            || { echo "::error::image does not report the commit it was built from"; exit 1; }
          echo "$out" | grep -q "build-arg" \
            || { echo "::error::image reports a commit but not via the build arg"; exit 1; }

      # The other half: a build given no commit must say so and fail, rather
      # than naming something plausible. Reuses every cached layer above, so
      # it costs seconds.
      - name: An image built without a commit refuses to claim one
        run: |
          docker build -t sentinel-ci-nosha .
          if docker run --rm sentinel-ci-nosha sentinel version; then
            echo "::error::a build with no GIT_SHA reported success"; exit 1
          fi
          out=$(docker run --rm sentinel-ci-nosha sentinel version 2>/dev/null || true)
          echo "$out"
          echo "$out" | grep -q "commit *unknown" \
            || { echo "::error::expected the commit to be reported as unknown"; exit 1; }
          # And it must not claim the placeholder came from a build arg - the
          # `source` field exists to say how we know, so it has to be right
          # when the answer is "we don't".
          echo "$out" | grep -q "source *unknown" \
            || { echo "::error::a build given no commit claimed a provenance"; exit 1; }

  # Decision-point mutation score, as a floor that can only go up.
  #
  # Deliberately NOT part of the `test` job: mutant generation is ~8 minutes and
  # the run itself several more, which would put ten minutes on every push for a
  # signal that changes slowly. Weekly and on-demand keeps the ratchet without
  # making the feedback loop useless.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install mutmut

      # Fails if the score drops below scripts/mutation-floor.txt, and raises
      # the floor when it improves - so a decision this suite pins today cannot
      # quietly stop being pinned tomorrow.
      - name: Decision-point mutation score
        id: mutation
        run: scripts/mutation-check.sh --check

      # A weekly job whose failure sits unread in the Actions tab is the
      # ten-hours-of-red problem with a longer fuse. Filing an issue is the one
      # notification path that needs no secrets and reaches a human through
      # normal repo notifications - and it leaves a record that outlives the
      # 90-day log retention.
      #
      # Deliberately NOT routed through the operator alerting channel (#53):
      # that lives inside the running service and needs the database and the
      # channel credentials, neither of which a CI runner has or should have.
      - name: Open an issue when the floor breaks
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --label "mutation-floor" \
            --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "The weekly decision-point mutation run scored below the floor in" \
            "\`scripts/mutation-floor.txt\`." \
            "" \
            "That means a decision this suite used to pin, it no longer does -" \
            "some change removed a test's grip on a comparison, a boolean, or a" \
            "continue/break without any test going red." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "Commit: ${{ github.sha }}" \
            "" \
            "Reproduce locally with \`scripts/mutation-check.sh\` - the survivor" \
            "list is printed in full.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Mutation score dropped below the floor" \
              --label "mutation-floor,epic-10-reliability,priority: p2" --body "$body"
          fi
