# The Minas AI Guardian app API (decision 21) - the one contract the server
# and the iOS/Android apps share.
#
# tests/test_api_contract.py holds the server to this file: the routes here
# must be exactly sentinel/api.py's ROUTES, and every response the server
# gives is validated against the schema for its status. Objects are closed
# (additionalProperties: false), so a field the server adds without adding it
# here fails the build, and so does a documented field it stops sending.
# The portal answers any /api/ request whose body length is invalid or over
# 8 KiB with 400 `invalid_request` before the route runs, so every operation
# documents a 400.
# The app's client is generated from this file.
openapi: 3.1.0
info:
  title: Minas AI Guardian app API
  version: "1"
  description: >-
    Read-only monitoring of a member's own exchange accounts, for the Minas
    AI Guardian iOS and Android apps. Sign in with the portal's email,
    password and two-factor code; two-factor must be on. Every response is
    scoped to the signed-in member's accounts.
servers:
  - url: https://guardian.minastrade.com
security:
  - bearer: []
paths:
  /api/v1/session:
    post:
      operationId: signIn
      summary: Sign in and register this device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignInRequest"}
      responses:
        "200": {$ref: "#/components/responses/Tokens"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403":
          description: Two-factor is off for this login (error `two_factor_required`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
    delete:
      operationId: signOut
      summary: End this device's sign-in
      responses:
        "204": {description: 'Signed out.'}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/session/refresh:
    post:
      operationId: refresh
      summary: Trade the refresh token for a new pair
      description: >-
        The refresh token is replaced on every use. Presenting a replaced one
        ends the device's sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefreshRequest"}
      responses:
        "200": {$ref: "#/components/responses/Tokens"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/invitation/code:
    post:
      operationId: checkInvitationCode
      summary: Accepting an invitation, step 1 - the emailed code
      description: >-
        Decision 17 (2026-10-28): Minas emails a member an invitation code
        when it sets their monitoring up. One answer, after one floor of
        time, for an unknown address and a wrong code; five wrong codes
        retire the invitation. The step token carries the proof to the next
        step for fifteen minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvitationCodeRequest"}
      responses:
        "200":
          description: The code was right.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitationStep"}
        "400": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/invitation/password:
    post:
      operationId: chooseInvitationPassword
      summary: Accepting an invitation, step 2 - the password, and the two-factor secret
      description: >-
        Holds the password (hashed) on the invitation and starts a two-factor
        enrolment. Not a login yet: nothing signs in with it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvitationPasswordRequest"}
      responses:
        "200":
          description: The secret to put in the authenticator app.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/InvitationTwoFactor"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/invitation/two-factor:
    post:
      operationId: finishInvitation
      summary: Accepting an invitation, step 3 - a working two-factor code makes the login
      description: >-
        Only now does the login exist. It opens the invited accounts that
        still list the address, this device is signed in, and the recovery
        codes come back once - the app shows them before it stores the
        tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InvitationTwoFactorRequest"}
      responses:
        "200": {$ref: "#/components/responses/SignedInWithRecoveryCodes"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/two-factor/start:
    post:
      operationId: startTwoFactor
      summary: Two-factor for a login that has a password and no second factor yet
      description: >-
        Authorised by the email and password, as the portal's Security page
        is after a password sign-in. Counted on the sign-in's limiter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TwoFactorStartRequest"}
      responses:
        "200":
          description: The secret to put in the authenticator app.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TwoFactorSecret"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/two-factor/confirm:
    post:
      operationId: confirmTwoFactor
      summary: Turn two-factor on with a working code, and sign this device in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TwoFactorConfirmRequest"}
      responses:
        "200": {$ref: "#/components/responses/SignedInWithRecoveryCodes"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/devices/{id}:
    delete:
      operationId: revokeDevice
      summary: Sign one of this login's devices out
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "204": {description: 'Signed out.'}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: The member's accounts and whether each is being watched
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accounts"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: Alerts on the member's accounts, newest first
      parameters:
        - {name: severity, in: query, schema: {$ref: "#/components/schemas/Severity"}}
        - {name: account, in: query, schema: {type: integer}}
        - {name: from, in: query, description: "YYYY-MM-DD, inclusive", schema: {type: string, format: date}}
        - {name: to, in: query, description: "YYYY-MM-DD, inclusive", schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertList"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/alerts/{id}:
    get:
      operationId: getIncident
      summary: One incident, as the portal's incident page shows it
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incident"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      summary: Acknowledge an alert, which stops a CRITICAL's escalation
      parameters:
        - {$ref: "#/components/parameters/Id"}
      responses:
        "200":
          description: Acknowledged, now or earlier. The first acknowledgement stands.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Acknowledgement"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/activity:
    get:
      operationId: listActivity
      summary: Every change to how the member's accounts are watched or reached
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Activity"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/limits:
    get:
      operationId: getLimits
      summary: What the Guardian can and cannot do, and the member's sensitivity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Limits"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /api/v1/security:
    get:
      operationId: getSecurity
      summary: Two-factor state and the devices signed in to this login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Security"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The access token from sign-in or refresh. Valid 15 minutes.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer}
  responses:
    Tokens:
      description: A new token pair.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Tokens"}
    SignedInWithRecoveryCodes:
      description: Signed in, with the recovery codes - shown once, and never again.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SignedInWithRecoveryCodes"}
    Error:
      description: An error, with a code the app can act on and a sentence a person can read.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum: [invalid_json, invalid_request, invalid_credentials, two_factor_required, too_many_attempts,
                 invalid_refresh_token, unauthorized, not_found, method_not_allowed, invalid_filter, internal_error,
                 invitation_not_accepted, step_expired, password_too_short, invitation_refused,
                 code_not_accepted, two_factor_unavailable, two_factor_already_on, two_factor_not_on]
        message: {type: string}
    SignInRequest:
      type: object
      required: [email, password, code]
      properties:
        email: {type: string}
        password: {type: string}
        code: {type: string, description: 'The six-digit code from the member''s authenticator, or a recovery code.'}
        device_name: {type: string, description: 'Shown on the member''s device list and in the sign-in email.'}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string}
    Tokens:
      type: object
      additionalProperties: false
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_in, device_id]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        expires_in: {type: integer, description: 'Seconds the access token is valid.'}
        refresh_token: {type: string}
        refresh_expires_in: {type: integer, description: 'Seconds the refresh token is valid unused.'}
        device_id: {type: integer}
    Severity:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    InvitationCodeRequest:
      type: object
      required: [email, code]
      properties:
        email: {type: string}
        code: {type: string, description: 'The code from Minas''s email, as typed: case, spaces and dashes do not matter.'}
    InvitationStep:
      type: object
      additionalProperties: false
      required: [step_token, email]
      properties:
        step_token: {type: string, description: 'Proof of the code, for the next step; fifteen minutes.'}
        email: {type: string}
    InvitationPasswordRequest:
      type: object
      required: [step_token, password]
      properties:
        step_token: {type: string}
        password: {type: string}
    InvitationTwoFactor:
      type: object
      additionalProperties: false
      required: [step_token, secret, otpauth_uri]
      properties:
        step_token: {type: string}
        secret: {type: string, description: 'The TOTP secret, base32, to type into an authenticator app.'}
        otpauth_uri: {type: string, description: 'The same secret as an otpauth:// link an authenticator app opens.'}
    InvitationTwoFactorRequest:
      type: object
      required: [step_token, code]
      properties:
        step_token: {type: string}
        code: {type: string, description: 'The six-digit code the authenticator shows.'}
        device_name: {type: string, description: 'Shown on the member''s device list and in the sign-in email.'}
    TwoFactorStartRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string}
    TwoFactorSecret:
      type: object
      additionalProperties: false
      required: [secret, otpauth_uri]
      properties:
        secret: {type: string, description: 'The TOTP secret, base32, to type into an authenticator app.'}
        otpauth_uri: {type: string, description: 'The same secret as an otpauth:// link an authenticator app opens.'}
    TwoFactorConfirmRequest:
      type: object
      required: [email, password, code]
      properties:
        email: {type: string}
        password: {type: string}
        code: {type: string, description: 'The six-digit code the authenticator shows.'}
        device_name: {type: string, description: 'Shown on the member''s device list and in the sign-in email.'}
    SignedInWithRecoveryCodes:
      type: object
      additionalProperties: false
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_in, device_id, recovery_codes]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        expires_in: {type: integer, description: 'Seconds the access token is valid.'}
        refresh_token: {type: string}
        refresh_expires_in: {type: integer, description: 'Seconds the refresh token is valid unused.'}
        device_id: {type: integer}
        recovery_codes:
          type: array
          items: {type: string}
          description: 'Each works once, to sign in without the authenticator. Stored hashed: this is the only time they exist.'
    Accounts:
      type: object
      additionalProperties: false
      required: [overall, checked_at, stale_after_seconds, attention, pending_pauses, accounts]
      properties:
        overall: {type: string, enum: [watching, degraded, not_watching]}
        checked_at: {type: string}
        stale_after_seconds: {type: integer}
        attention:
          description: 'The newest alert nobody has acknowledged - what the home page puts first (decision 16) - or null.'
          oneOf:
            - {$ref: "#/components/schemas/Attention"}
            - {type: "null"}
        pending_pauses:
          type: array
          description: 'Accounts whose monitoring is about to stop: a pause asked for, not yet cancelled (#98).'
          items: {$ref: "#/components/schemas/PendingPause"}
        accounts:
          type: array
          items: {$ref: "#/components/schemas/Account"}
    Attention:
      type: object
      additionalProperties: false
      required: [id, account_id, account_name, severity, rule, message, sent_at]
      properties:
        id: {type: integer}
        account_id: {type: integer}
        account_name: {type: string}
        severity: {$ref: "#/components/schemas/Severity"}
        rule: {type: string}
        message: {type: string}
        sent_at: {type: string}
    PendingPause:
      type: object
      additionalProperties: false
      required: [account_id, account_name, execute_at]
      properties:
        account_id: {type: integer}
        account_name: {type: string}
        execute_at: {type: string, description: 'When monitoring stops unless the pause is cancelled.'}
    Account:
      type: object
      additionalProperties: false
      required: [id, name, exchange, status, watched, reason, cause, last_success_at, role]
      properties:
        id: {type: integer}
        name: {type: string}
        exchange: {type: [string, "null"]}
        status: {type: string}
        watched: {type: boolean}
        reason: {type: [string, "null"], description: 'Why it is not being watched, in words; null when it is.'}
        cause:
          type: [string, "null"]
          enum: [paused, tamper_suspected, not_active, host_auth_failure, key_rejected, never_checked, no_recent_check,
                 null]
          description: >-
            The same judgement as `reason`, as a word to act on; null when it is being watched.
            `key_rejected` is the member's to fix: the key is refused, and replacing it restarts monitoring.
            `host_auth_failure` is Minas's: the exchange is refusing this key along with others because of a
            change on Minas's side, so nothing is needed from the member and the key must be left as it is.
        last_success_at: {type: [string, "null"]}
        role: {type: string, enum: [primary, non-primary], description: 'What this login may change on it (#25).'}
    AlertList:
      type: object
      additionalProperties: false
      required: [total, limit, offset, alerts]
      properties:
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        alerts:
          type: array
          items: {$ref: "#/components/schemas/AlertSummary"}
    AlertSummary:
      type: object
      additionalProperties: false
      required: [id, account_id, account_name, sent_at, severity, rule, message, confidence, delivered_to,
                 acknowledged_at, acknowledged_by, repeat_count, last_repeat_at]
      properties:
        id: {type: integer}
        account_id: {type: integer}
        account_name: {type: string}
        sent_at: {type: string}
        severity: {$ref: "#/components/schemas/Severity"}
        rule: {type: string}
        message: {type: string}
        confidence: {type: [string, "null"]}
        delivered_to: {type: integer, description: 'Channels it reached. 0 means detected and told to nobody.'}
        acknowledged_at: {type: [string, "null"]}
        acknowledged_by: {type: [string, "null"]}
        repeat_count: {type: [integer, "null"]}
        last_repeat_at: {type: [string, "null"]}
    Incident:
      type: object
      additionalProperties: false
      required: [id, account_id, account_name, exchange, rule, severity, confidence, message, sent_at, evidence,
                 delivered_to, acknowledged_at, acknowledged_by, repeat_count, last_repeat_at, advice,
                 balances_before, balances_after, expected_marks]
      properties:
        id: {type: integer}
        account_id: {type: integer}
        account_name: {type: string}
        exchange: {type: string}
        rule: {type: string}
        severity: {$ref: "#/components/schemas/Severity"}
        confidence: {type: [string, "null"]}
        message: {type: string}
        sent_at: {type: string}
        evidence: {type: object, description: 'What was detected, as recorded. Keys vary by rule.'}
        delivered_to: {type: integer}
        acknowledged_at: {type: [string, "null"]}
        acknowledged_by: {type: [string, "null"]}
        repeat_count: {type: [integer, "null"], description: 'Repeats folded into this alert while it kept firing (#22).'}
        last_repeat_at: {type: [string, "null"]}
        advice:
          oneOf:
            - {$ref: "#/components/schemas/Advice"}
            - {type: "null"}
        balances_before:
          type: array
          items: {$ref: "#/components/schemas/Balance"}
        balances_after:
          type: array
          items: {$ref: "#/components/schemas/Balance"}
        expected_marks:
          type: array
          items: {$ref: "#/components/schemas/ExpectedMark"}
    Advice:
      type: object
      additionalProperties: false
      required: [lead, steps, note]
      properties:
        lead: {type: string}
        steps: {type: array, items: {type: string}}
        note: {type: string}
    Balance:
      type: object
      additionalProperties: false
      required: [coin, quantity, snapshot_at]
      properties:
        coin: {type: string}
        quantity: {type: string, description: 'Exact decimal, as a string. Never parse it as a float.'}
        snapshot_at: {type: string}
    ExpectedMark:
      type: object
      additionalProperties: false
      required: [marked_by, note, created_at]
      properties:
        marked_by: {type: string}
        note: {type: [string, "null"]}
        created_at: {type: string}
    Acknowledgement:
      type: object
      additionalProperties: false
      required: [id, newly_acknowledged, acknowledged_at, acknowledged_by]
      properties:
        id: {type: integer}
        newly_acknowledged: {type: boolean}
        acknowledged_at: {type: [string, "null"]}
        acknowledged_by: {type: [string, "null"]}
    Activity:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/ActivityEvent"}
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [id, account_id, account_name, type, title, detail, actor, created_at]
      properties:
        id: {type: integer}
        account_id: {type: integer}
        account_name: {type: string}
        type: {type: string}
        title: {type: string}
        detail: {type: string}
        actor: {type: [string, "null"], description: 'Null means nobody can be named for the change.'}
        created_at: {type: string}
    Limits:
      type: object
      additionalProperties: false
      required: [lead, headline, why, does, cannot, timing, retention, retention_reviewed, sensitivity]
      properties:
        lead: {type: string}
        headline: {$ref: "#/components/schemas/Statement"}
        why: {$ref: "#/components/schemas/Statement"}
        does:
          type: array
          items: {$ref: "#/components/schemas/Statement"}
        cannot:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [title, text, see_status]
            properties:
              title: {type: string}
              text: {type: string}
              see_status: {type: boolean, description: 'The sentence points at "am I being watched?".'}
        timing:
          type: object
          additionalProperties: false
          required: [balances_every_seconds, permissions_every_seconds]
          properties:
            balances_every_seconds: {type: integer}
            permissions_every_seconds: {type: integer}
        retention:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [what, how_long]
            properties:
              what: {type: string}
              how_long: {type: string}
        retention_reviewed: {type: boolean}
        sensitivity:
          type: array
          items: {$ref: "#/components/schemas/AccountSensitivity"}
    Statement:
      type: object
      additionalProperties: false
      required: [title, text]
      properties:
        title: {type: string}
        text: {type: string}
    AccountSensitivity:
      type: object
      additionalProperties: false
      required: [account_id, account_name, thresholds]
      properties:
        account_id: {type: integer}
        account_name: {type: string}
        thresholds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [title, setting, value, phrase, set_for_this_account]
            properties:
              title: {type: string}
              setting: {type: string}
              value: {type: string}
              phrase: {type: string}
              set_for_this_account: {type: boolean}
    Security:
      type: object
      additionalProperties: false
      required: [two_factor_enabled, recovery_codes_left, devices]
